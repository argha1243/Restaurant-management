<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Restaurant Management</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f5f5f5; }
      header { background: #243b53; color: white; padding: 1rem; }
      header a { color: #dce2f0; margin-right: 1rem; text-decoration: none; }
      .container { padding: 1.5rem; }
      .card { background: white; padding: 1rem; margin-bottom: 1rem; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
      table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
      th, td { padding: 0.5rem; border-bottom: 1px solid #e1e1e1; text-align: left; }
      form { display: grid; gap: 0.5rem; max-width: 540px; }
      label { font-weight: bold; }
      input, textarea { padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; }
      button { padding: 0.6rem 1rem; border: none; border-radius: 4px; background: #2b6cb0; color: white; cursor: pointer; }
      button:hover { background: #2c5282; }
      .flash { padding: 0.5rem 0.75rem; border-radius: 4px; margin-bottom: 0.75rem; }
      .flash.success { background: #e6ffed; color: #22543d; border: 1px solid #9ae6b4; }
      .flash.error { background: #ffe6e6; color: #742a2a; border: 1px solid #feb2b2; }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <a href="{{ url_for('index') }}">Dashboard</a>
        <a href="{{ url_for('orders_list') }}">Orders</a>
        <a href="{{ url_for('purchases_list') }}">Purchases</a>
        <a href="{{ url_for('stage2_list') }}">Stage 2 Production</a>
        <a href="{{ url_for('losses_list') }}">Losses</a>
      </nav>
    </header>
    <div class="container">
      {% with messages = get_flashed_messages(with_categories=True) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </div>
  </body>
</html>
